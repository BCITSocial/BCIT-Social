name: PR Quick Scan

on:
  pull_request:
    branches-ignore:
      - main
      - Dev
      - dev
  push:
    branches-ignore:
      - main
      - Dev
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: BCIT-Social.csproj

jobs:
  quick-check:
    name: Lint & Fast Build
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment & Cache
        uses: ./.github/actions/setup-dotnet-cached

      - name: Roslyn Format Validation
        run: dotnet format "${{ env.PROJECT_PATH }}" --no-restore --verify-no-changes --verbosity minimal

      - name: Fast Compilation Check
        run: dotnet build "${{ env.PROJECT_PATH }}" --no-restore -c Debug /p:TreatWarningsAsErrors=false
