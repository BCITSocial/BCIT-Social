name: Build and test

on:
  pull_request:
    branches:
      - Dev
      - main
  push:
    branches:
      - Dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require Dev as the source branch for main
        if: github.base_ref == 'main' && github.head_ref != 'Dev'
        run: |
          Write-Error "Pull requests into main must come from Dev."
          exit 1

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build
